<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam Head | 3D Interactive Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
        
        #three-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }
        
        .overlay {
            position: fixed; z-index: 10; pointer-events: none;
        }
        .overlay > * { pointer-events: auto; }
        
        .loading-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease-out;
        }
        .loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-bar {
            width: 200px; height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px; overflow: hidden; margin-top: 20px;
        }
        .loading-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
        }
        .error-message {
            color: #ef4444; margin-top: 20px; text-align: center; max-width: 400px;
        }
    </style>
</head>
<body class="bg-black text-white">
    <div id="loading-screen" class="loading-screen">
        <div class="heading-font text-2xl font-bold text-white mb-2">ADAM HEAD</div>
        <div class="text-sm text-gray-400" id="loading-text">Loading 3D Model...</div>
        <div class="loading-bar">
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
        <div class="error-message" id="error-message" style="display: none;"></div>
    </div>

    <canvas id="three-canvas"></canvas>

    <div class="overlay top-0 left-0 w-full p-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <svg class="w-10 h-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <span class="heading-font font-bold text-xl">ADAM HEAD</span>
        </div>
        <div class="flex gap-3">
            <button class="cursor-pointer px-5 py-2 rounded-full bg-white/10 backdrop-blur-md hover:bg-white/20 text-sm font-medium border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
                About
            </button>
            <button class="cursor-pointer px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
                Explore
            </button>
        </div>
    </div>

    <div class="overlay bottom-0 left-0 w-full p-6 flex justify-between items-end">
        <div class="max-w-md">
            <h1 class="heading-font font-bold text-4xl md:text-5xl mb-3">Interactive 3D Portrait</h1>
            <p class="text-gray-300 text-sm md:text-base leading-relaxed">
                Drag to rotate • Scroll to zoom • High-fidelity 3D model
            </p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const loadingScreen = document.getElementById('loading-screen');
        const loadingBarFill = document.getElementById('loading-bar-fill');
        const loadingText = document.getElementById('loading-text');
        const errorMessage = document.getElementById('error-message');

        const canvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 0.6);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffaa88, 0.8);
        backLight.position.set(0, 2, -5);
        scene.add(backLight);

        const gltfLoader = new GLTFLoader();
        const modelPath = './adamHead/adamHead.gltf';

        let modelLoaded = false;

        gltfLoader.load(
            modelPath,
            (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.0 / maxDim;
                model.scale.setScalar(scale);
                model.position.sub(center.multiplyScalar(scale));
                model.position.y -= size.y * scale * 0.5;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);
                modelLoaded = true;
                loadingText.textContent = 'Model loaded successfully!';
                loadingBarFill.style.width = '100%';

                setTimeout(() => {
                    loadingScreen.classList.add('fade-out');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
                }, 500);
            },
            (progress) => {
                if (progress.total > 0) {
                    const percent = (progress.loaded / progress.total) * 100;
                    loadingBarFill.style.width = percent + '%';
                    loadingText.textContent = `Loading: ${Math.round(percent)}%`;
                }
            },
            (error) => {
                console.error('Error loading model:', error);
                loadingText.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Error loading 3D model. Using fallback 3D object.';
                loadingBarFill.style.width = '100%';

                const geometry = new THREE.SphereGeometry(1, 64, 64);
                const material = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.castShadow = true;
                scene.add(sphere);

                setTimeout(() => {
                    loadingScreen.classList.add('fade-out');
                    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);
                }, 1000);
            }
        );

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let spherical = { theta: 0, phi: Math.PI / 2.5 };
        const sphericalRadius = 3;

        const updateCameraPosition = () => {
            camera.position.x = sphericalRadius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.position.y = sphericalRadius * Math.cos(spherical.phi);
            camera.position.z = sphericalRadius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.lookAt(0, 0, 0);
        };
        updateCameraPosition();

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            spherical.theta -= deltaX * 0.01;
            spherical.phi -= deltaY * 0.01;
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
            updateCameraPosition();
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; canvas.style.cursor = 'grab'; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.multiplyScalar(1 + e.deltaY * 0.001);
            camera.lookAt(0, 0, 0);
        }, { passive: false });

        canvas.style.cursor = 'grab';

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const animate = () => {
            requestAnimationFrame(animate);
            if (!isDragging) {
                spherical.theta += 0.002;
                updateCameraPosition();
            }
            renderer.render(scene, camera);
        };
        animate();
    </script>
</body>
</html>
