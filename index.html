<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PopUp — The Sum of All Knowledge</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06060f; color: #fff; }

    #loader {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #06060f; font-family: 'Inter', sans-serif;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loader .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.04em; background: linear-gradient(135deg, #3366cc, #6699ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
    #loader .sub { color: rgba(255,255,255,0.3); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2rem; }
    #loader .bar-track { width: 240px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
    #loader .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3366cc, #6699ff); border-radius: 2px; transition: width 0.3s ease; }
    #loader .hint { margin-top: 1.5rem; font-size: 0.7rem; color: rgba(255,255,255,0.15); letter-spacing: 0.08em; }

    #canvas-container { position: fixed; inset: 0; z-index: 0; }

    #progress { position: fixed; right: 2rem; top: 50%; transform: translateY(-50%); z-index: 10; display: flex; flex-direction: column; gap: 0.7rem; pointer-events: none; }
    #progress .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.1); transition: all 0.4s; }
    #progress .dot.active { background: #3366cc; box-shadow: 0 0 10px rgba(51,102,204,0.6); transform: scale(1.4); }

    #section-counter { position: fixed; bottom: 2rem; right: 2rem; z-index: 10; font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 500; color: rgba(255,255,255,0.12); letter-spacing: 0.05em; pointer-events: none; }
    #section-counter .current { color: rgba(255,255,255,0.5); }

    #scroll-hint { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; opacity: 1; transition: opacity 0.5s; pointer-events: none; }
    #scroll-hint.hidden { opacity: 0; }
    #scroll-hint span { font-family: 'Inter', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.18); }
    #scroll-hint .line { width: 1px; height: 25px; background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent); animation: pulseLine 1.8s ease-in-out infinite; }
    @keyframes pulseLine { 0%, 100% { transform: scaleY(0.5); opacity: 0.3; } 50% { transform: scaleY(1); opacity: 1; } }

    .section { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; pointer-events: none; opacity: 0; transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
    .section.active { opacity: 1; pointer-events: auto; }
    .section .tag { font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #6699ff; margin-bottom: 1rem; }
    .section h2 { font-family: 'IBM Plex Serif', serif; font-size: clamp(2.5rem, 6vw, 6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #fff; max-width: 800px; }
    .section h2 .accent { background: linear-gradient(135deg, #3366cc, #6699ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section h2 .serif { font-family: 'IBM Plex Serif', serif; font-weight: 600; }
    .section p { font-family: 'Inter', sans-serif; font-size: 0.95rem; color: rgba(255,255,255,0.5); max-width: 600px; line-height: 1.7; margin-top: 1rem; }
    .section .specs { display: flex; gap: 2.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .section .spec { font-family: 'Inter', sans-serif; }
    .section .spec .val { font-size: 1.6rem; font-weight: 700; background: linear-gradient(135deg, #3366cc, #6699ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section .spec .lbl { font-size: 0.7rem; color: rgba(255,255,255,0.3); margin-top: 0.2rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .section .stat-card { font-family: 'Inter', sans-serif; padding: 1.2rem 1.5rem; background: rgba(51,102,204,0.04); border: 1px solid rgba(51,102,204,0.12); transition: all 0.3s; border-radius: 4px; }
    .section .stat-card:hover { background: rgba(51,102,204,0.08); border-color: rgba(51,102,204,0.3); }
    .section .stat-card .num { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #3366cc, #6699ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section .stat-card .desc { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 0.3rem; line-height: 1.4; }
    .section .btn { display: inline-block; font-family: 'Inter', sans-serif; margin-top: 2rem; padding: 0.9rem 2.5rem; border-radius: 3px; background: linear-gradient(135deg, #3366cc, #6699ff); color: #fff; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; border: none; pointer-events: auto; cursor: pointer; transition: all 0.3s; text-decoration: none; }
    .section .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(51,102,204,0.3); }
    .section .btn-outline { background: transparent; border: 1.5px solid rgba(51,102,204,0.3); margin-left: 1rem; }
    .section .btn-outline:hover { border-color: #6699ff; box-shadow: none; }
    .section.hero-center { align-items: center; text-align: center; }
    .section.hero-center h2 { max-width: 100%; }
    .section.hero-center p { margin-left: auto; margin-right: auto; }
    .section .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-top: 2rem; max-width: 700px; }
    .section .cards { display: flex; gap: 1.2rem; margin-top: 1.8rem; flex-wrap: wrap; }
    .section .card { font-family: 'Inter', sans-serif; padding: 1.2rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; max-width: 260px; }
    .section .card .icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .section .card .title { font-size: 0.85rem; font-weight: 600; color: #fff; margin-bottom: 0.3rem; }
    .section .card .desc { font-size: 0.7rem; color: rgba(255,255,255,0.35); line-height: 1.5; }
    .section .fact-list { margin-top: 1.5rem; max-width: 650px; }
    .section .fact { font-family: 'Inter', sans-serif; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.6; }
    .section .fact strong { color: rgba(255,255,255,0.8); font-weight: 600; }
    .section .fact .topic { color: #6699ff; font-weight: 500; }

    .section .on-this-day { margin-top: 1.5rem; }
    .section .day-event { font-family: 'Inter', sans-serif; display: flex; gap: 1rem; align-items: flex-start; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .section .day-event .year { font-size: 0.85rem; font-weight: 700; color: #6699ff; min-width: 60px; }
    .section .day-event .event-text { font-size: 0.8rem; color: rgba(255,255,255,0.5); line-height: 1.5; }

    @media (max-width: 768px) { .section { padding: 0 6%; } .section h2 { font-size: clamp(2rem, 8vw, 3.5rem); } #progress { right: 1.2rem; } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">PopUp</div>
    <div class="sub">The Sum of All Knowledge</div>
    <div class="bar-track"><div class="bar-fill" id="load-bar"></div></div>
    <div class="hint">Loading knowledge sphere…</div>
  </div>
  <div id="canvas-container"></div>
  <div id="progress"></div>
  <div id="section-counter"><span class="current" id="sec-current">01</span> / <span id="sec-total">05</span></div>
  <div id="scroll-hint"><span>Scroll to explore</span><div class="line"></div></div>
  <div id="ui-overlay"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
