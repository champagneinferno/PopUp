<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metawatt 3D - PopUp Visualization</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>Metawatt 3D Visualization</strong><br>
        Style: Bold-Cinematic<br>
        Use mouse to rotate/zoom
    </div>
    <div id="loading">Loading 3D Scene...</div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Black background from Metawatt
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting (bold-cinematic style)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffffff, 1.0);
        spotLight.position.set(5, 10, 5);
        spotLight.castShadow = true;
        scene.add(spotLight);
        
        // Add dramatic lighting for cinematic effect
        const redLight = new THREE.PointLight(0xff4444, 0.5, 20);
        redLight.position.set(-5, 3, 2);
        scene.add(redLight);
        
        const blueLight = new THREE.PointLight(0x4444ff, 0.5, 20);
        blueLight.position.set(5, 3, -2);
        scene.add(blueLight);
        
        // Load the 3D scene blueprint
        let blueprint = null;
        
        async function loadBlueprint() {
            try {
                const response = await fetch('3d_scene_blueprint.json');
                blueprint = await response.json();
                create3DObjects();
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading blueprint:', error);
                document.getElementById('loading').textContent = 'Error loading scene data';
            }
        }
        
        function create3DObjects() {
            if (!blueprint) return;
            
            const objects = blueprint['3d_objects'] || [];
            
            objects.forEach((obj, index) => {
                switch(obj.type) {
                    case 'navigation_ring':
                        createNavigationRing(obj);
                        break;
                    case 'hero_text':
                        createHeroText(obj);
                        break;
                    case 'content_panel':
                        createContentPanel(obj, index);
                        break;
                    default:
                        console.log('Unknown object type:', obj.type);
                }
            });
        }
        
        function createNavigationRing(data) {
            const navItems = data.elements || [];
            const radius = 5;
            const angleStep = (Math.PI * 2) / navItems.length;
            
            navItems.forEach((item, index) => {
                const angle = angleStep * index;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                // Create nav item as a floating panel
                const geometry = new THREE.BoxGeometry(1.5, 0.5, 0.1);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x1e90ff, // Blue from Metawatt palette
                    metalness: 0.8,
                    roughness: 0.2
                });
                const panel = new THREE.Mesh(geometry, material);
                panel.position.set(x, data.position.y, z);
                panel.lookAt(0, data.position.y, 0); // Face center
                panel.castShadow = true;
                scene.add(panel);
                
                // Add text (simplified - using a sprite for now)
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;
                context.fillStyle = 'white';
                context.font = '20px Arial';
                context.fillText(item.text, 10, 35);
                
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.scale.set(1.5, 0.4, 1);
                sprite.position.set(x, data.position.y + 0.3, z);
                sprite.lookAt(0, data.position.y + 0.3, 0);
                scene.add(sprite);
            });
        }
        
        function createHeroText(data) {
            // Create hero text as 3D text
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 128;
            context.fillStyle = '#ffffff';
            context.font = 'bold 48px Arial';
            context.textAlign = 'center';
            context.fillText(data.content, 512, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(8, 1, 1);
            sprite.position.set(data.position.x, data.position.y, data.position.z);
            scene.add(sprite);
        }
        
        function createContentPanel(data, index) {
            // Create content panel
            const geometry = new THREE.BoxGeometry(4, 2, 0.2);
            const material = new THREE.MeshStandardMaterial({ 
                color: index % 2 === 0 ? 0x333333 : 0x444444,
                metalness: 0.5,
                roughness: 0.5
            });
            const panel = new THREE.Mesh(geometry, material);
            panel.position.set(data.position.x, data.position.y, data.position.z);
            panel.castShadow = true;
            scene.add(panel);
            
            // Add heading and content text
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 512;
            
            // Heading
            context.fillStyle = '#ffffff';
            context.font = 'bold 32px Arial';
            context.fillText(data.heading || 'No heading', 10, 40);
            
            // Preview text (FULL content, word-wrapped)
            context.font = '18px Arial';
            context.fillStyle = '#aaaaaa';
            const preview = data.preview || '';
            const words = preview.split(' ');
            let line = '';
            let y = 80;
            const maxWidth = 1000;
            
            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i] + ' ';
                const metrics = context.measureText(testLine);
                
                if (metrics.width > maxWidth && i > 0) {
                    context.fillText(line, 10, y);
                    line = words[i] + ' ';
                    y += 25;
                    if (y > 490) break; // Stop if exceeds canvas
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, 10, y);
            
            const texture = new THREE.CanvasTexture(canvas);
            const textMaterial = new THREE.SpriteMaterial({ map: texture });
            const textSprite = new THREE.Sprite(textMaterial);
            textSprite.scale.set(3.5, 1.75, 1);
            textSprite.position.set(data.position.x, data.position.y, data.position.z + 0.15);
            scene.add(textSprite);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate nav ring slowly
            scene.children.forEach(child => {
                if (child.userData && child.userData.isNavRing) {
                    child.rotation.y += 0.001;
                }
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start
        loadBlueprint();
        animate();
        
    </script>
</body>
</html>
